<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام تحدي البارتي والمواجهات التفاعلية الجماعية">
  <meta name="theme-color" content="#121629">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="البارتي">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>اللاعب البطولي - تحدي البارتي</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #121629;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Cairo', sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: pulse 1.8s infinite ease-in-out;
    }
    .spinner {
      margin-top: 24px;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(157, 255, 0, 0.15);
      border-top: 4px solid #9DFF00;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-loading" class="loading-container">
    <img src="assets/assets/images/logo.png" alt="اللاعب البطولي" class="logo-img" onerror="this.src='favicon.png'" />
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
